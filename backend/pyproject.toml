[project]
name = "baseline-nutrition-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi==25.1.0",
    "fastapi==0.116.1",
    "pydantic==2.11.7",
    "uvicorn[standard]==0.35.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
