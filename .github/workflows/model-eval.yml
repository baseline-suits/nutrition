name: Meal model evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-eval:
    name: Live GPT-5.6 Luna eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXTERNAL_SERVICES_MODE: live
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BASELINE_ANALYSIS_MODEL: gpt-5.6-luna
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Abhängigkeiten installieren
        run: make -C backend ci-install

      - name: Live-Evaluation
        run: make -C backend eval-live

      - name: Evalbericht hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: meal-model-eval-${{ github.sha }}
          path: backend/artifacts/eval-live/
          if-no-files-found: error
          retention-days: 30
